name: Windows build

env:
  APP_VERSION: v0.4
  ARTIFACT_NAME: secret-fix-v0.4-win-x64

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/SecretFix.App/SecretFix.App.csproj
      - name: Restore tests
        run: dotnet restore tests/SecretFix.Tests/SecretFix.Tests.csproj
      - name: Build
        run: dotnet build src/SecretFix.App/SecretFix.App.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/SecretFix.Tests/SecretFix.Tests.csproj -c Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/SecretFix.App/SecretFix.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/${{ env.ARTIFACT_NAME }}
      - name: Rename executable with version
        shell: pwsh
        run: Rename-Item -Path "artifacts/${{ env.ARTIFACT_NAME }}/SecretFix.exe" -NewName "secret-fix-${{ env.APP_VERSION }}.exe"
      - name: Verify artifact contents
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "artifacts/${{ env.ARTIFACT_NAME }}" | Select-Object FullName, Length
          if (-not (Test-Path "artifacts/${{ env.ARTIFACT_NAME }}/secret-fix-${{ env.APP_VERSION }}.exe")) { throw "Versioned executable missing" }
          if (-not (Test-Path "artifacts/${{ env.ARTIFACT_NAME }}/Assets/Backgrounds/red-galaxy.mp4")) { throw "Background video missing from artifact" }
          if (-not (Test-Path "artifacts/${{ env.ARTIFACT_NAME }}/Assets/Devices/Mice/logitech-g-pro-x.png")) { throw "Mouse assets missing from artifact" }
          if (-not (Test-Path "artifacts/${{ env.ARTIFACT_NAME }}/Assets/Devices/Keyboards/wooting-60he.png")) { throw "Keyboard assets missing from artifact" }
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}/
