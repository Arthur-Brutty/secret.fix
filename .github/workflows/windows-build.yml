name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/SecretFix.App/SecretFix.App.csproj
      - name: Build
        run: dotnet build src/SecretFix.App/SecretFix.App.csproj -c Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/SecretFix.App/SecretFix.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/secret-fix-win-x64
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-fix-win-x64
          path: artifacts/secret-fix-win-x64/
